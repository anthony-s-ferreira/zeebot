# Captive portal do Zee: resolve qualquer domínio para o próprio Raspberry Pi
# enquanto o Access Point de configuração estiver ativo.
#
# Instalado em /etc/NetworkManager/dnsmasq-shared.d/zee-captive.conf
# (o NetworkManager usa este dnsmasq apenas em conexões "shared", ou seja,
#  somente no modo Access Point — a rede normal não é afetada).

address=/#/10.42.0.1
dhcp-option=114,http://10.42.0.1:8080/
dhcp-option=160,http://10.42.0.1:8080/
